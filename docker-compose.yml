# Jalankan: docker compose up -d
services:
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # dashboard hanya bisa dibuka dari komputer ini
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      # WAHA mengirim setiap pesan (masuk & keluar) ke bot lewat jaringan internal Docker
      WHATSAPP_HOOK_URL: http://bot:8080/webhook?token=${WEBHOOK_TOKEN}
      WHATSAPP_HOOK_EVENTS: message.any
    volumes:
      - ./waha-sessions:/app/.sessions   # login WhatsApp tersimpan di sini

  bot:
    build: .
    restart: unless-stopped
    depends_on: [waha]
    env_file: .env
    environment:
      WAHA_URL: http://waha:3000
    volumes:
      - ./data:/app/data                # riwayat chat & draft
      - ./knowledge:/app/knowledge      # edit file .md lalu restart bot untuk update pengetahuan
    ports:
      - "127.0.0.1:8080:8080"
